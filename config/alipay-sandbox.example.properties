# Copy to .runtime/alipay/application.properties. Never put private keys in tracked files.
localjoy.payment.alipay-enabled=true
localjoy.payment.mock-enabled=true
localjoy.payment.reconcile-enabled=true
localjoy.payment.app-id=
localjoy.payment.seller-id=
localjoy.payment.private-key-path=.runtime/alipay/app-private-key.txt
localjoy.payment.alipay-public-key-path=.runtime/alipay/alipay-public-key.txt
# Optional public HTTPS endpoint ending in /payment/alipay/notify.
# Blank uses outbound query reconciliation; localhost is not reachable by Alipay.
localjoy.payment.notify-url=
